<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
  <div class="flex flex-col gap-1">
    <label for="role-name" class="text-sm font-medium text-slate-700">Nombre</label>
    <input
      pInputText
      id="role-name"
      formControlName="name"
      autocomplete="off"
      placeholder="COORDINADOR"
      class="w-full"
    />
    <small class="text-slate-400">El backend lo guarda siempre en MAYÚSCULAS.</small>
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p-message severity="error" size="small" variant="simple">
        Escribe un nombre de máximo 60 caracteres.
      </p-message>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="role-description" class="text-sm font-medium text-slate-700">
      Descripción <span class="font-normal text-slate-400">(opcional)</span>
    </label>
    <textarea
      pTextarea
      id="role-description"
      formControlName="description"
      rows="3"
      placeholder="Acompaña a los promotores en la revisión de proyectos"
      class="w-full"
    ></textarea>
  </div>

  @if (!role()) {
    <div class="flex flex-col gap-1">
      <label for="role-status" class="text-sm font-medium text-slate-700">Estado inicial</label>
      <p-select
        inputId="role-status"
        formControlName="status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
      />
    </div>
  } @else {
    <p-message severity="warn" size="small" variant="simple">
      Si renombras un rol con usuarios asignados, revisa antes sus asignaciones.
    </p-message>
  }

  <div class="mt-2 flex justify-end gap-2">
    <button pButton type="button" severity="secondary" text (click)="cancelled.emit()">
      <span pButtonLabel>Cancelar</span>
    </button>
    <button pButton type="submit" [loading]="saving()">
      <i pButtonIcon class="pi pi-save"></i>
      <span pButtonLabel>{{ role() ? 'Guardar cambios' : 'Crear rol' }}</span>
    </button>
  </div>
</form>
